name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint (go vet)
        run: go vet ./...

      - name: Unit tests
        run: go test -v -count=1 -timeout=120s -coverprofile=coverage.out ./...

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o ./webhook-bridge .
          echo "Binary built: webhook-bridge (${VERSION})"

      - name: Smoke data flow test
        run: |
          chmod +x scripts/smoke-data-flow.sh
          ./scripts/smoke-data-flow.sh

      - name: Generate merge report
        if: always()
        run: |
          chmod +x scripts/run-ci-local.sh
          REPORT_FILE=merge-report.md ./scripts/run-ci-local.sh --full
          cat merge-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-report
          path: merge-report.md
          retention-days: 7

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f merge-report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file merge-report.md || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
