name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # go directive in go.mod = 1.26; pin a patch that includes the latest
        # stdlib security fixes (GO-2026-5037, GO-2026-5039 fixed in 1.26.5).
        go: ['1.26.5']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        env:
          GOTOOLCHAIN: auto

      - name: Unit tests
        run: go test -v -count=1 -race -timeout=120s -coverprofile=coverage-${{ matrix.go }}.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage-${{ matrix.go }}.out | tail -1 | awk '{print $3}' | sed 's/%//')
          THRESHOLD=60
          echo "Total coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "FAIL: coverage ${COVERAGE}% below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "PASS: coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.go }}
          path: coverage-${{ matrix.go }}.out
          retention-days: 7

  build:
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags "-X main.version=${VERSION}" -o ./webhook-bridge-${{ matrix.os }}-${{ matrix.arch }} .
          echo "Binary built: webhook-bridge-${{ matrix.os }}-${{ matrix.arch }} (${VERSION})"

      - name: Trivy vulnerability scan (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0  # soft-fail: results uploaded to Security tab

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: coverage-1.26.5
          path: .
      - uses: codecov/codecov-action@v6
        with:
          files: ./coverage-1.26.5.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for smoke test
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o ./webhook-bridge .

      - name: Smoke data flow test
        run: |
          chmod +x scripts/smoke-data-flow.sh
          ./scripts/smoke-data-flow.sh

      - name: Generate merge report
        if: always()
        run: |
          chmod +x scripts/run-ci-local.sh
          REPORT_FILE=merge-report.md ./scripts/run-ci-local.sh --full
          cat merge-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merge-report
          path: merge-report.md
          retention-days: 7

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f merge-report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file merge-report.md || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
