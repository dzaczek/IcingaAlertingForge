name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=3m
          skip-cache: false

      - name: Vulnerability check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Unit tests
        run: go test -v -count=1 -race -timeout=120s -coverprofile=coverage.out -coverpkg=./... ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          THRESHOLD=50
          echo "Total coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "FAIL: coverage ${COVERAGE}% below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "PASS: coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o ./webhook-bridge .
          echo "Binary built: webhook-bridge (${VERSION})"

      - name: Trivy vulnerability scan (fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0  # soft-fail: results uploaded to Security tab

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Smoke data flow test
        run: |
          chmod +x scripts/smoke-data-flow.sh
          ./scripts/smoke-data-flow.sh

      - name: Generate merge report
        if: always()
        run: |
          chmod +x scripts/run-ci-local.sh
          REPORT_FILE=merge-report.md ./scripts/run-ci-local.sh --full
          cat merge-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-report
          path: merge-report.md
          retention-days: 7

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f merge-report.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file merge-report.md || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
