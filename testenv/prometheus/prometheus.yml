global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'iaf-webhook-bridge'
    metrics_path: /metrics
    basic_auth:
      username: admin
      password: admin123
    static_configs:
      - targets: ['webhook-bridge:8080']
