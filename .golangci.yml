version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

formatters:
  enable:
    - gofmt

linters-settings:
  misspell:
    locale: US
  gosec:
    excludes:
      - G402  # TLS InsecureSkipVerify is config-controlled
      - G104  # Intentional ignoring of some write errors (audit log, SSE)

issues:
  exclude-dirs:
    - testenv
    - wiki
    - .github
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    - path: _benchmark_test\.go
      linters:
        - gosec

run:
  timeout: 3m
